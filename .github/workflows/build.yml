name: Build ImmortalWrt + UA2F (oray_x1-pro)
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: build-ua2f
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/lib/mono /opt/hostedtoolcache /usr/local/.cache 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl time squashfs-tools

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: src/dl
          key: dl-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: dl-${{ github.ref_name }}-

      - name: Cache build_dir
        uses: actions/cache@v4
        with:
          path: src/build_dir
          key: build-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: build-${{ github.ref_name }}-

      - name: Build firmware
        run: bash build.sh
        env:
          STOCK_BIN: ${{ github.workspace }}/stock/stock.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-ua2f-oray_x1-pro
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
